<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>픽앤뽑 (Pick & Pop) - AI 스마트 자판기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- Leaflet.js CDN (API 키 필요 없는 오픈소스 무료 지도) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- 헤더 -->
    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🤖</span>
                <h1 class="text-2xl font-bold tracking-tight">픽앤뽑 <span class="text-sm font-normal opacity-80">(Pick & Pop)</span></h1>
            </div>
            <span class="text-xs bg-blue-700 px-3 py-1 rounded-full font-medium border border-blue-500">스마트 자판기</span>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-4xl mx-auto w-full px-4 py-6 flex-1 space-y-6">

        <!-- 검색 및 입력 카드 -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
            <label for="searchInput" class="block text-sm font-semibold text-slate-700 mb-2">상품명 또는 현재 위치 검색</label>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="searchInput" placeholder="예: 코카콜라, 칸쵸, 강남역" class="flex-1 px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 placeholder-slate-400">
                <div class="flex gap-2">
                    <button onclick="checkStock()" class="flex-1 sm:flex-none px-5 py-3 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition active:scale-95 shadow-sm">
                        재고 확인
                    </button>
                    <button onclick="reserveItem()" class="flex-1 sm:flex-none px-5 py-3 bg-emerald-600 text-white font-semibold rounded-xl hover:bg-emerald-700 transition active:scale-95 shadow-sm">
                        예약하기
                    </button>
                </div>
            </div>
        </section>

        <!-- 지도 영역 카드 -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <span class="text-blue-600">🗺️</span> 전국 17개 광역지자체 자판기 위치 (마커 클릭 시 재고 확인)
                </h2>
                <div class="flex items-center gap-2 text-xs">
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span>충분</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span>부족</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-rose-500 inline-block"></span>품절</span>
                </div>
            </div>
            <div id="map" class="w-full h-72 sm:h-80 rounded-xl border border-slate-200 bg-slate-100 z-0"></div>
        </section>

        <!-- 선택된 자판기 정보 및 재고 상태 카드 -->
        <section id="vendingDetail" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
            <div class="flex justify-between items-start mb-3">
                <div>
                    <h3 id="vendingTitle" class="text-lg font-bold text-slate-800">자판기 정보</h3>
                    <p id="vendingSub" class="text-xs text-slate-500 mt-0.5">상세 재고 현황</p>
                </div>
                <span id="vendingBadge" class="px-3 py-1 text-xs font-bold rounded-full">상태</span>
            </div>
            <div id="vendingStockList" class="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-2"></div>
        </section>

        <!-- AI 분석 및 관리자 예측 알림 카드 -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <span class="text-blue-600">📊</span> AI 판매 분석 & 관리자 재고 예측
                </h2>
                <button onclick="analyzeAdminNotice()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg border font-medium">관리자 AI 분석 실행</button>
            </div>
            <div id="aiResult" class="p-4 bg-slate-50 border border-slate-200 rounded-xl text-sm leading-relaxed text-slate-600 min-h-[100px] flex items-center justify-center text-center">
                상품명이나 위치를 입력한 후 [재고 확인] 또는 자판기 마커를 클릭해 주세요.
            </div>
        </section>

        <!-- QR코드 예약 카드 -->
        <section id="qrSection" class="hidden bg-white rounded-2xl shadow-sm border border-blue-200 p-6 text-center space-y-4">
            <div class="inline-block px-3 py-1 bg-blue-100 text-blue-700 font-semibold text-xs rounded-full">예약 완료</div>
            <h3 class="text-xl font-bold text-slate-800">자판기 픽업 QR 코드</h3>
            <p class="text-sm text-slate-500">아래 QR코드를 자판기 스캐너에 대어주세요.</p>
            
            <div class="flex justify-center py-2">
                <div id="qrcode" class="p-3 bg-white border border-slate-200 rounded-xl shadow-inner"></div>
            </div>

            <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-amber-800 text-sm font-medium">
                ⏱️ 남은 시간: <span id="timer" class="font-bold text-amber-600">05:00</span>
                <p class="text-xs text-amber-600 mt-1">5분 안에 방문하지 않으면 예약이 자동 취소됩니다.</p>
            </div>
        </section>

    </main>

    <!-- Script Logic -->
    <script>
        let map;
        let timerInterval;

        // 대한민국 공식 17개 광역지방자치단체 자판기 데이터 (음료 + 간식류 및 이모티콘 적용)
        const vendingMachines = [
            { id: 1, name: '픽앤뽑 서울특별시점', lat: 37.5665, lng: 126.9780, statusText: '충분 (초록)', badgeClass: 'bg-emerald-100 text-emerald-800 border-emerald-300', stocks: [{ item: '🥤 코카콜라', count: 12, status: 'sufficient' }, { item: '🍌 바나나우유', count: 8, status: 'sufficient' }, { item: '🍫 칸쵸', count: 15, status: 'sufficient' }, { item: '💧 포카리스웨트', count: 2, status: 'shortage' }] },
            { id: 2, name: '픽앤뽑 부산광역시점', lat: 35.1796, lng: 129.0756, statusText: '부족 (노랑)', badgeClass: 'bg-amber-100 text-amber-800 border-amber-300', stocks: [{ item: '🥔 포카칩', count: 3, status: 'shortage' }, { item: '🍫 칸쵸', count: 1, status: 'shortage' }, { item: '🥤 칠성사이다', count: 5, status: 'sufficient' }] },
            { id: 3, name: '픽앤뽑 대구광역시점', lat: 35.8714, lng: 128.6014, statusText: '충분 (초록)', badgeClass: 'bg-emerald-100 text-emerald-800 border-emerald-300', stocks: [{ item: '🍫 칸쵸', count: 10, status: 'sufficient' }, { item: '💧 포카리스웨트', count: 7, status: 'sufficient' }, { item: '☕ 아메리카노', count: 11, status: 'sufficient' }] },
            { id: 4, name: '픽앤뽑 인천광역시점', lat: 37.4563, lng: 126.7052, statusText: '부족 (노랑)', badgeClass: 'bg-amber-100 text-amber-800 border-amber-300', stocks: [{ item: '🥤 코카콜라', count: 2, status: 'shortage' }, { item: '🥔 포카칩', count: 2, status: 'shortage' }, { item: '💧 생수', count: 10, status: 'sufficient' }] },
            { id: 5, name: '픽앤뽑 광주광역시점', lat: 35.1595, lng: 126.8526, statusText: '충분 (초록)', badgeClass: 'bg-emerald-100 text-emerald-800 border-emerald-300', stocks: [{ item: '🍌 바나나우유', count: 9, status: 'sufficient' }, { item: '🍫 칸쵸', count: 14, status: 'sufficient' }, { item: '🥤 칠성사이다', count: 6, status: 'sufficient' }] },
            { id: 6, name: '픽앤뽑 대전광역시점', lat: 36.3504, lng: 127.3845, statusText: '부족 (노랑)', badgeClass: 'bg-amber-100 text-amber-800 border-amber-300', stocks: [{ item: '💧 포카리스웨트', count: 1, status: 'shortage' }, { item: '🍫 칸쵸', count: 3, status: 'shortage' }, { item: '🥤 코카콜라', count: 8, status: 'sufficient' }] },
            { id: 7, name: '픽앤뽑 울산광역시점', lat: 35.5384, lng: 129.3114, statusText: '품절 (빨강)', badgeClass: 'bg-rose-100 text-rose-800 border-rose-300', stocks: [{ item: '🥤 코카콜라', count: 0, status: 'soldout' }, { item: '🍫 칸쵸', count: 0, status: 'soldout' }, { item: '💧 포카리스웨트', count: 0, status: 'soldout' }] },
            { id: 8, name: '픽앤뽑 세종특별자치시점', lat: 36.4800, lng: 127.2890, statusText: '충분 (초록)', badgeClass: 'bg-emerald-100 text-emerald-800 border-emerald-300', stocks: [{ item: '🍫 칸쵸', count: 12, status: 'sufficient' }, { item: '🍌 바나나우유', count: 10, status: 'sufficient' }, { item: '💧 포카리스웨트', count: 8, status: 'sufficient' }] },
            { id: 9, name: '픽앤뽑 경기도점 (수원)', lat: 37.2636, lng: 127.0286, statusText: '충분 (초록)', badgeClass: 'bg-emerald-100 text-emerald-800 border-emerald-300', stocks: [{ item: '🥤 코카콜라', count: 20, status: 'sufficient' }, { item: '🥔 포카칩', count: 15, status: 'sufficient' }, { item: '🍫 칸쵸', count: 18, status: 'sufficient' }] },
            { id: 10, name: '픽앤뽑 강원특별자치도점 (춘천)', lat: 37.8813, lng: 127.7298, statusText: '부족 (노랑)', badgeClass: 'bg-amber-100 text-amber-800 border-amber-300', stocks: [{ item: '🍫 칸쵸', count: 2, status: 'shortage' }, { item: '☕ 아메리카노', count: 4, status: 'shortage' }, { item: '💧 생수', count: 12, status: 'sufficient' }] },
            { id: 11, name: '픽앤뽑 충청북도점 (청주)', lat: 36.6372, lng: 127.4897, statusText: '충분 (초록)', badgeClass: 'bg-emerald-100 text-emerald-800 border-emerald-300', stocks: [{ item: '💧 포카리스웨트', count: 9, status: 'sufficient' }, { item: '🍌 바나나우유', count: 7, status: 'sufficient' }, { item: '🍫 칸쵸', count: 11, status: 'sufficient' }] },
            { id: 12, name: '픽앤뽑 충청남도점 (홍성)', lat: 36.6012, lng: 126.6608, statusText: '부족 (노랑)', badgeClass: 'bg-amber-100 text-amber-800 border-amber-300', stocks: [{ item: '🥤 칠성사이다', count: 3, status: 'shortage' }, { item: '🥔 포카칩', count: 1, status: 'shortage' }, { item: '🍫 칸쵸', count: 5, status: 'sufficient' }] },
            { id: 13, name: '픽앤뽑 전북특별자치도점 (전주)', lat: 35.8242, lng: 127.1480, statusText: '충분 (초록)', badgeClass: 'bg-emerald-100 text-emerald-800 border-emerald-300', stocks: [{ item: '🍫 칸쵸', count: 13, status: 'sufficient' }, { item: '🥤 코카콜라', count: 10, status: 'sufficient' }, { item: '💧 포카리스웨트', count: 6, status: 'sufficient' }] },
            { id: 14, name: '픽앤뽑 전라남도점 (무안)', lat: 34.8161, lng: 126.4629, statusText: '부족 (노랑)', badgeClass: 'bg-amber-100 text-amber-800 border-amber-300', stocks: [{ item: '🍌 바나나우유', count: 2, status: 'shortage' }, { item: '🍫 칸쵸', count: 3, status: 'shortage' }, { item: '💧 생수', count: 8, status: 'sufficient' }] },
            { id: 15, name: '픽앤뽑 경상북도점 (안동)', lat: 36.5684, lng: 128.7294, statusText: '충분 (초록)', badgeClass: 'bg-emerald-100 text-emerald-800 border-emerald-300', stocks: [{ item: '🥤 코카콜라', count: 11, status: 'sufficient' }, { item: '🥔 포카칩', count: 8, status: 'sufficient' }, { item: '🍫 칸쵸', count: 9, status: 'sufficient' }] },
            { id: 16, name: '픽앤뽑 경상남도점 (창원)', lat: 35.2280, lng: 128.6811, statusText: '부족 (노랑)', badgeClass: 'bg-amber-100 text-amber-800 border-amber-300', stocks: [{ item: '💧 포카리스웨트', count: 2, status: 'shortage' }, { item: '🍫 칸쵸', count: 2, status: 'shortage' }, { item: '☕ 아메리카노', count: 6, status: 'sufficient' }] },
            { id: 17, name: '픽앤뽑 제주특별자치도점 (제주)', lat: 33.4996, lng: 126.5312, statusText: '충분 (초록)', badgeClass: 'bg-emerald-100 text-emerald-800 border-emerald-300', stocks: [{ item: '🍫 칸쵸', count: 16, status: 'sufficient' }, { item: '🍌 바나나우유', count: 12, status: 'sufficient' }, { item: '💧 포카리스웨트', count: 14, status: 'sufficient' }] }
        ];

        window.onload = function() {
            map = L.map('map').setView([36.3504, 127.3845], 7);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            vendingMachines.forEach(vm => {
                const marker = L.marker([vm.lat, vm.lng]).addTo(map);
                marker.bindPopup(`<b>${vm.name}</b><br>상태: ${vm.statusText}`);
                
                marker.on('click', () => {
                    selectVendingMachine(vm);
                });
            });
        };

        function selectVendingMachine(vm) {
            const detailSection = document.getElementById('vendingDetail');
            const title = document.getElementById('vendingTitle');
            const sub = document.getElementById('vendingSub');
            const badge = document.getElementById('vendingBadge');
            const stockList = document.getElementById('vendingStockList');

            detailSection.classList.remove('hidden');
            title.innerText = vm.name;
            sub.innerText = `위치: 위도 ${vm.lat}, 경도 ${vm.lng}`;
            badge.innerText = vm.statusText;
            badge.className = `px-3 py-1 text-xs font-bold rounded-full border ${vm.badgeClass}`;

            stockList.innerHTML = vm.stocks.map(s => {
                let colorClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
                let statusLabel = '충분';
                if (s.status === 'shortage') {
                    colorClass = 'bg-amber-50 text-amber-700 border-amber-200';
                    statusLabel = '부족';
                } else if (s.status === 'soldout') {
                    colorClass = 'bg-rose-50 text-rose-700 border-rose-200';
                    statusLabel = '품절';
                }
                return `
                    <div class="p-3 rounded-xl border ${colorClass} flex flex-col justify-between">
                        <span class="font-bold text-sm">${s.item}</span>
                        <div class="flex justify-between items-center mt-2 text-xs">
                            <span>재고: <b>${s.count}개</b></span>
                            <span class="font-bold">[${statusLabel}]</span>
                        </div>
                    </div>
                `;
            }).join('');

            analyzeItemPrompt(`[${vm.name}] 자판기 마커가 클릭되었습니다. 현재 재고 상태(${vm.statusText})를 바탕으로 사용자 안내를 생성해줘.`);
        }

        async function checkStock() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                alert('상품명 또는 위치를 입력해주세요.');
                return;
            }
            await analyzeItemPrompt(`사용자가 "${query}"을(를) 검색했습니다. 주변 자판기를 추천하고, 재고 상태(초록: 충분, 노랑: 부족, 빨강: 품절)를 포함해 답변해줘.`);
        }

        async function analyzeAdminNotice() {
            await analyzeItemPrompt(`최근 자판기 판매 데이터를 바탕으로 재고 부족이 예상되는 자판기를 예측하고, 관리자에게 즉시 보낼 재고 보충 알림 리포트를 작성해줘.`);
        }

        async function analyzeItemPrompt(promptText) {
            const aiResult = document.getElementById('aiResult');
            aiResult.innerHTML = `<div class="flex items-center gap-2 text-blue-600"><svg class="animate-spin h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> AI가 데이터 및 재고 정보를 분석 중입니다...</div>`;

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText })
                });

                const data = await response.json();
                if (data.text) {
                    aiResult.innerHTML = `<div class="text-left w-full whitespace-pre-line text-slate-700">${data.text}</div>`;
                } else if (data.error) {
                    aiResult.innerText = `[오류] ${data.error}`;
                } else {
                    aiResult.innerText = '분석 결과를 불러오지 못했습니다.';
                }
            } catch (err) {
                console.error(err);
                aiResult.innerText = '오류가 발생했습니다. Vercel 환경변수(GEMINI_API_KEY) 설정을 확인해주세요.';
            }
        }

        async function reserveItem() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                alert('예약할 상품명 또는 위치를 입력해주세요.');
                return;
            }

            await checkStock();

            const qrSection = document.getElementById('qrSection');
            const qrcodeDiv = document.getElementById('qrcode');
            qrcodeDiv.innerHTML = '';

            const reservationCode = 'PICK-' + Math.floor(100000 + Math.random() * 900000);
            new QRCode(qrcodeDiv, {
                text: reservationCode,
                width: 140,
                height: 140
            });

            qrSection.classList.remove('hidden');
            qrSection.scrollIntoView({ behavior: 'smooth' });

            startTimer(300);
        }

        function startTimer(duration) {
            clearInterval(timerInterval);
            let timer = duration;
            const timerDisplay = document.getElementById('timer');

            timerInterval = setInterval(() => {
                const minutes = parseInt(timer / 60, 10);
                const seconds = parseInt(timer % 60, 10);

                const minStr = minutes < 10 ? "0" + minutes : minutes;
                const secStr = seconds < 10 ? "0" + seconds : seconds;

                timerDisplay.textContent = `${minStr}:${secStr}`;

                if (--timer < 0) {
                    clearInterval(timerInterval);
                    alert('5분 이내 미방문으로 예약이 자동 취소되었습니다.');
                    document.getElementById('qrSection').classList.add('hidden');
                }
            }, 1000);
        }
    </script>
</body>
</html>
