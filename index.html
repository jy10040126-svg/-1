<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartVend - AI 자판기 위치 & QR 예약</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 backdrop-blur z-20">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="fa-solid me-2 fa-box-open text-indigo-500 text-2xl"></i>
        <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
          SmartVend AI
        </h1>
      </div>
      <span class="text-xs bg-indigo-500/20 text-indigo-300 px-3 py-1 rounded-full border border-indigo-500/30">
        <i class="fa-solid fa-bolt text-indigo-400 mr-1"></i> 실시간 재고 연동
      </span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-6 space-y-6">

    <!-- AI Search & Analysis Card -->
    <section class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-5 shadow-xl">
      <h2 class="text-lg font-semibold mb-2 flex items-center gap-2">
        <i class="fa-solid fa-wand-magic-sparkles text-cyan-400"></i> AI 자판기 & 재고 예측 검색
      </h2>
      <p class="text-sm text-slate-400 mb-4">원하는 음료나 원하는 위치를 입력하면 AI가 재고 고갈 속도를 예측하여 최적의 자판기를 추천합니다.</p>

      <div class="flex gap-2">
        <input id="aiInput" type="text" 
               placeholder="예: '3분 거리 내에 포카리스웨트 남아있는 자판기 추천해줘'"
               class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition">
        <button onclick="askAI()" id="searchBtn" 
                class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-3 rounded-xl transition flex items-center gap-2 whitespace-nowrap">
          <span>AI 분석</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>

      <!-- AI Response Area -->
      <div id="aiResult" class="hidden mt-4 p-4 bg-slate-900/90 border border-indigo-500/30 rounded-xl text-sm leading-relaxed text-slate-200">
      </div>
    </section>

    <!-- Vending Machine List -->
    <section class="space-y-4">
      <h2 class="text-lg font-semibold flex items-center justify-between">
        <span><i class="fa-solid fa-location-dot text-rose-400 mr-2"></i> 주변 자판기 목록</span>
        <span class="text-xs text-slate-400 font-normal">반경 500m 이내</span>
      </h2>

      <div id="vendingList" class="grid md:grid-cols-2 gap-4">
        <!-- Dynamic Rendered Cards -->
      </div>
    </section>

  </main>

  <!-- QR Modal -->
  <div id="qrModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-sm w-full text-center relative shadow-2xl">
      <button onclick="closeQRModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
      
      <h3 id="qrModalTitle" class="text-lg font-bold mb-1">QR 선점 예약 완료</h3>
      <p id="qrModalSub" class="text-xs text-slate-400 mb-4">15분 이내에 자판기 스캐너에 태그하세요.</p>

      <div class="bg-white p-4 rounded-xl inline-block my-2 shadow-inner">
        <div id="qrcode"></div>
      </div>

      <div class="mt-4 p-3 bg-slate-900 rounded-xl text-left text-xs space-y-1 border border-slate-700/50">
        <div class="flex justify-between"><span class="text-slate-400">예약 항목:</span><span id="qrItemName" class="font-semibold text-indigo-300"></span></div>
        <div class="flex justify-between"><span class="text-slate-400">수령 자판기:</span><span id="qrLocationName"></span></div>
        <div class="flex justify-between"><span class="text-slate-400">예약 코드:</span><span id="qrCodeText" class="font-mono text-cyan-400"></span></div>
      </div>
    </div>
  </div>

  <script>
    // 자판기 및 실시간 재고 시뮬레이션 데이터
    const vendingMachines = [
      {
        id: "VEND-01",
        name: "강남역 2번 출구 앞",
        distance: "120m (도보 2분)",
        inventory: [
          { name: "코카콜라 350ml", stock: 2, salesRate: "높음 (10분 내 품절 예상)", price: 1500 },
          { name: "포카리스웨트", stock: 8, salesRate: "보통", price: 1400 },
          { name: "몬스터 에너지", stock: 0, salesRate: "품절", price: 2200 }
        ]
      },
      {
        id: "VEND-02",
        name: "역삼 빌딩 1층 로비",
        distance: "350m (도보 5분)",
        inventory: [
          { name: "코카콜라 350ml", stock: 12, salesRate: "여유", price: 1500 },
          { name: "포카리스웨트", stock: 5, salesRate: "보통", price: 1400 },
          { name: "몬스터 에너지", stock: 4, salesRate: "높음", price: 2200 }
        ]
      }
    ];

    // 카드 렌더링
    function renderVendingMachines() {
      const listEl = document.getElementById('vendingList');
      listEl.innerHTML = vendingMachines.map(v => `
        <div class="bg-slate-800/60 border border-slate-700/70 rounded-xl p-5 hover:border-slate-600 transition">
          <div class="flex justify-between items-start mb-3">
            <div>
              <h3 class="font-bold text-base text-slate-100">${v.name}</h3>
              <p class="text-xs text-slate-400 mt-0.5"><i class="fa-solid fa-person-walking text-indigo-400"></i> ${v.distance}</p>
            </div>
            <span class="text-xs bg-slate-700 text-slate-300 font-mono px-2 py-1 rounded">ID: ${v.id}</span>
          </div>

          <div class="space-y-2 my-4 border-t border-b border-slate-700/50 py-3">
            ${v.inventory.map(item => `
              <div class="flex items-center justify-between text-xs">
                <span class="text-slate-300">${item.name} (${item.price.toLocaleString()}원)</span>
                <div class="flex items-center gap-2">
                  <span class="font-mono ${item.stock <= 2 ? 'text-rose-400 font-bold' : 'text-emerald-400'}">
                    ${item.stock > 0 ? item.stock + '개 남음' : '품절'}
                  </span>
                  ${item.stock > 0 ? `
                    <button onclick="openQRModal('${v.name}', '${item.name}', '${v.id}')" 
                            class="bg-indigo-600/80 hover:bg-indigo-500 text-white text-[11px] px-2 py-1 rounded transition">
                      QR 예약
                    </button>
                  ` : `
                    <span class="text-[11px] bg-slate-700 text-slate-500 px-2 py-1 rounded cursor-not-allowed">불가</span>
                  `}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    // AI 질문 요청
    async function askAI() {
      const inputEl = document.getElementById('aiInput');
      const resultEl = document.getElementById('aiResult');
      const btn = document.getElementById('searchBtn');
      const prompt = inputEl.value.trim();

      if (!prompt) return alert('원하시는 상품이나 질문을 입력해주세요.');

      resultEl.classList.remove('hidden');
      resultEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> AI가 자판기 재고 분석 및 고갈 가능성을 예측하는 중입니다...';
      btn.disabled = true;

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: prompt,
            vendingData: vendingMachines
          })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '분석 중 오류 발생');

        // 간단한 Markdown 변환
        const formatted = data.result
          .replace(/\*\*(.*?)\*\*/g, '<strong class="text-indigo-300">$1</strong>')
          .replace(/\n/g, '<br>');

        resultEl.innerHTML = `<div class="prose prose-invert max-w-none text-xs leading-relaxed">${formatted}</div>`;
      } catch (err) {
        resultEl.innerHTML = `<span class="text-rose-400"><i class="fa-solid fa-circle-exclamation mr-1"></i> ${err.message}</span>`;
      } finally {
        btn.disabled = false;
      }
    }

    // QR 모달
    let qrInstance = null;
    function openQRModal(locationName, itemName, vendId) {
      const reservationCode = 'RES-' + Math.random().toString(36).substring(2, 9).toUpperCase();
      
      document.getElementById('qrModalTitle').innerText = 'QR 예약 티켓 생성 완료';
      document.getElementById('qrItemName').innerText = itemName;
      document.getElementById('qrLocationName').innerText = locationName;
      document.getElementById('qrCodeText').innerText = reservationCode;

      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';

      const payload = JSON.stringify({
        vendId: vendId,
        item: itemName,
        code: reservationCode,
        timestamp: Date.now()
      });

      qrInstance = new QRCode(qrContainer, {
        text: payload,
        width: 160,
        height: 160,
        colorDark: "#0f172a",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      document.getElementById('qrModal').classList.remove('hidden');
    }

    function closeQRModal() {
      document.getElementById('qrModal').classList.add('hidden');
    }

    // 초기화
    renderVendingMachines();
  </script>
</body>
</html>
